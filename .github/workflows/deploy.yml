# Compila il sito Astro e lo pubblica su GitHub Pages a ogni push su main.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  # Permette di lanciare il deploy a mano dalla tab "Actions" di GitHub
  workflow_dispatch:

# Permessi richiesti dalla pubblicazione su Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le run in coda vengono sostituite dalla più recente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila il sito
        run: npm run build

      - name: Prepara l'artefatto per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
